name = "hex-bareiss-mathlib"
defaultTargets = ["HexBareissMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrixMathlib"
git = "https://github.com/leanprover/hex-matrix-mathlib.git"
rev = "v0.7.0"

[[require]]
name = "HexBareiss"
git = "https://github.com/leanprover/hex-bareiss.git"
rev = "v0.7.0"

[[require]]
name = "HexDeterminantMathlib"
git = "https://github.com/leanprover/hex-determinant-mathlib.git"
rev = "v0.7.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d870b9068518a0870842d15a0cd42637ec30b587"

[[lean_lib]]
name = "HexBareissMathlib"

[[lean_lib]]
name = "HexBareissMathlibTests"
globs = ["HexBareissMathlib.Tests"]
